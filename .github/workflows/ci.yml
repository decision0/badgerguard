name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      
      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build
        run: |
          cd backend
          cargo build --workspace --all-features
      
      - name: Test
        run: |
          cd backend
          cargo test --workspace
      
      - name: Lint
        run: |
          cd backend
          cargo clippy --workspace -- -D warnings
      
      - name: Format check
        run: |
          cd backend
          cargo fmt -- --check

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/admin/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend/admin
          npm ci
      
      - name: Lint
        run: |
          cd frontend/admin
          npm run lint
      
      - name: Build
        run: |
          cd frontend/admin
          npm run build
      
      - name: Test
        run: |
          cd frontend/admin
          npm test -- --run

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      
      - name: Run cargo audit
        uses: rustsec/rustsec-action@master
        with:
          command: audit
          args: --deny warnings

