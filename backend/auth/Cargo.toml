[package]
name = "badgerguard-auth"
version = "0.1.0"
edition = "2021"
authors = ["BadgerGuard Contributors"]
license = "Apache-2.0 OR MIT"
description = "BadgerGuard Auth Service - IdP Integration & MFA"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tonic = "0.11"
prost = "0.12"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }
redis = { version = "0.24", features = ["tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
jsonwebtoken = "9.2"
oauth2 = "4.4"
webauthn-rs = "0.4"
totp-lite = "2.0"
base64 = "0.21"
sha2 = "0.10"
rand = "0.8"
bcrypt = "0.15"
badgerguard-shared = { path = "../shared" }

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
