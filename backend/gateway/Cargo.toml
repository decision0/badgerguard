[package]
name = "badgerguard-gateway"
version = "0.1.0"
edition = "2021"
authors = ["BadgerGuard Contributors"]
license = "Apache-2.0 OR MIT"
description = "BadgerGuard Gateway - Zero-Trust MFA Reverse Proxy"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "compression-gzip", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
rustls = { version = "0.21", features = ["dangerous_configuration"] }
rustls-pemfile = "2.0"
rcgen = "0.12"
tonic = "0.11"
prost = "0.12"
bytes = "1.5"
badgerguard-shared = { path = "../shared" }

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
