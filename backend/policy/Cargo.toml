[package]
name = "badgerguard-policy"
version = "0.1.0"
edition = "2021"
authors = ["BadgerGuard Contributors"]
license = "Apache-2.0 OR MIT"
description = "BadgerGuard Policy Engine - OPA Integration"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tonic = "0.11"
prost = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.11", features = ["json"] }
badgerguard-shared = { path = "../shared" }

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
