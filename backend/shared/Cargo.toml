[package]
name = "badgerguard-shared"
version = "0.1.0"
edition = "2021"
authors = ["BadgerGuard Contributors"]
license = "Apache-2.0 OR MIT"
description = "BadgerGuard Shared Types and Utilities"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

