version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: badgerguard
      POSTGRES_USER: badgerguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badgerguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  opa:
    image: openpolicyagent/opa:latest
    command:
      - "run"
      - "--server"
      - "--log-level=info"
    volumes:
      - ./backend/policy/policies:/policies
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: ..
      dockerfile: deployment/docker/auth/Dockerfile
    environment:
      DATABASE_URL: postgres://badgerguard:${POSTGRES_PASSWORD:-changeme}@postgres:5432/badgerguard
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "50051:50051"

  policy:
    build:
      context: ..
      dockerfile: deployment/docker/policy/Dockerfile
    environment:
      OPA_URL: http://opa:8181
    depends_on:
      opa:
        condition: service_healthy
    ports:
      - "50052:50052"

  gateway:
    build:
      context: ..
      dockerfile: deployment/docker/gateway/Dockerfile
    environment:
      AUTH_SERVICE: http://auth:50051
      POLICY_ENGINE: http://policy:50052
      REDIS_URL: redis://redis:6379
    depends_on:
      - auth
      - policy
      - redis
    ports:
      - "8080:8080"
      - "8443:8443"

  frontend:
    build:
      context: ..
      dockerfile: deployment/docker/frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - gateway

volumes:
  postgres_data:
  redis_data:

